<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060912" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GQ Control" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/pwa-icon.svg" />
    <link rel="stylesheet" href="/mobile.css" />
    <link rel="stylesheet" href="/mobile-premium.css" />
    <title>Giang Quant Control</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="/mobile-status-stability.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch((error) => {
            console.warn("GQX PWA registration failed:", error);
          });
        });
      }

      // Mobile-only UI helper: nút Home chỉ kích hoạt Dashboard hiện có,
      // không thay đổi business logic, database, realtime hay remote commands.
      window.addEventListener("load", () => {
        const setupMobileHome = () => {
          if (window.innerWidth > 900) return;
          if (!document.querySelector(".app-shell")) return;
          if (document.querySelector(".mobile-home-button")) return;

          const homeButton = document.createElement("button");
          homeButton.type = "button";
          homeButton.className = "mobile-home-button";
          homeButton.setAttribute("aria-label", "Về trang chủ");
          homeButton.setAttribute("title", "Về trang chủ");
          homeButton.textContent = "⌂";

          homeButton.addEventListener("click", () => {
            const dashboardButton = Array.from(
              document.querySelectorAll(".nav-item")
            ).find((button) =>
              (button.textContent || "").toLowerCase().includes("dashboard")
            );

            dashboardButton?.click();
            window.scrollTo({ top: 0, behavior: "smooth" });
          });

          document.body.appendChild(homeButton);
        };

        setupMobileHome();

        const observer = new MutationObserver(setupMobileHome);
        observer.observe(document.body, { childList: true, subtree: true });

        setTimeout(() => observer.disconnect(), 15000);
      });
    </script>
  </body>
</html>
